name: Mani

# 14 nov · la prova delle MANI SU TUTTO JARVIS nel simulatore: la versione di prova (Debug) legge i tasti dello schermo dalla
# descrizione d'accessibilità di iOS (senza VoiceOver) e ne preme uno (-provaMani <etichetta>). Le letture (mani1.json prima,
# mani2.json dopo il tocco) e le foto sono nell'artefatto «mani-simulatore».
# Parte SOLO quando il messaggio del commit contiene [mani] (o a mano dalla scheda Actions).

on:
  push:
  workflow_dispatch:

concurrency:
  group: mani-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mani:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mani]')
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Accende il simulatore
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          tutti = [x for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          pro = [x for x in tutti if x['name'].endswith(' Pro')]
          scelto = (pro or tutti)[-1]
          print(scelto['udid']); print(scelto['name'], file=sys.stderr)")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Compila la versione di prova
        run: |
          set -o pipefail
          xcodebuild -project "Untitled Project.xcodeproj" -scheme "Untitled Project" -configuration Debug -destination "id=$UDID" \
            -derivedDataPath dd CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation -skipMacroValidation build 2>&1 | tee build-mani.log | grep -E "error: |BUILD (SUCCEEDED|FAILED)"

      - name: Legge e preme i tasti
        run: |
          APP=$(ls -d dd/Build/Products/Debug-iphonesimulator/*.app | grep -v -i watch | head -1)
          ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant all "$ID" || true
          mkdir -p esiti
          prova() {   # nome, argomenti…
            local nome=$1; shift
            xcrun simctl terminate "$UDID" "$ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$ID" "$@" > /dev/null
            sleep 13
            xcrun simctl io "$UDID" screenshot "esiti/${nome}_prima.png" > /dev/null
            sleep 7
            xcrun simctl io "$UDID" screenshot "esiti/${nome}_dopo.png" > /dev/null
            sleep 4
            DATI=$(xcrun simctl get_app_container "$UDID" "$ID" data)
            cp "$DATI/tmp/mani1.json" "esiti/${nome}_mani1.json" 2>/dev/null || echo "manca mani1 ($nome)"
            cp "$DATI/tmp/mani2.json" "esiti/${nome}_mani2.json" 2>/dev/null || echo "manca mani2 ($nome)"
            rm -f "$DATI/tmp/mani1.json" "$DATI/tmp/mani2.json"
          }
          prova casa -provaMani Diario
          prova meteo -provaSezione meteo -provaMani GLOBO
          ls -la esiti
          for f in esiti/*_mani1.json; do echo "== $f"; python3 -c "
          import json,sys; d=json.load(open('$f')); print('quanti', d.get('quanti'), 'toccato', d.get('toccato'), 'attivato', d.get('attivato'), 'voiceover', d.get('voiceover'))
          for t in d.get('tasti', [])[:60]: print(t['id'], repr(t['etichetta']), t['tipo'], t['sel'], t['x'], t['y'], t['w'], t['h'], t['classe'])"; done

      - name: Salva gli esiti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mani-simulatore
          path: |
            esiti
            build-mani.log
          retention-days: 7
